<main id="main">
  <section class="page-hero"><div class="container" id="hero"></div></section>
  <section class="section--tight"><div class="container">
    <div class="toolbar" id="filters"></div>
    <div class="chips" id="branch-chips" role="group" aria-label="{{page.branches_label}}" style="margin-top:12px"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="split"><ul class="list" id="list" aria-label="{{labels.languages}}"></ul><div class="map" id="map" role="region" aria-label="{{page.map_label}}"></div></div>
    <div class="legend" id="legend"></div>
  </div></section>
</main>
